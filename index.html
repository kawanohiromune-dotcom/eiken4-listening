const TARGET_SEC=15*60, FINISH_THRESHOLD_SEC=14*60+30, STORE_KEY='eiken4_learning_v7';
let qi=0, phase=0, selected=null, speaking=false, step1Feedback=null, heardCurrent=false, phaseAudioDone=false;
let sessionStarted=false, sessionFinished=false, sessionElapsedSec=0, sessionSavedSec=0, sessionQuestionNo=1, sessionFirstAttempts=0, sessionCorrect=0, sessionWrong=0, currentStreak=0, bestStreak=0;
let sessionSeen=new Set(), recentQ=[], sessionWrongMap={}, sessionAttempted=[];
const card=document.getElementById('card'), qnum=document.getElementById('qnum'), phaseName=document.getElementById('phaseName'), round=document.getElementById('round'), hint=document.getElementById('hint');
const nextBtn=document.getElementById('nextBtn'), prevBtn=document.getElementById('prevBtn'), replayBtn=document.getElementById('replayBtn');
const settings=document.getElementById('settings'), maleSel=document.getElementById('maleVoice'), femaleSel=document.getElementById('femaleVoice'), rateSel=document.getElementById('rate'), sfxOnSel=document.getElementById('sfxOn'), sfxVolSel=document.getElementById('sfxVol');
let voices=[], audioCtx=null;

function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function blankStore(){return {questions:questions.map(()=>({attempts:0,correct:0,wrong:0,lastSeen:0})),wh:{},words:{},phrases:{},daily:{},sessions:[]}}
function loadStore(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(x&&x.questions?.length===questions.length)return x}catch(e){}return blankStore()}
let learn=loadStore();
function saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(learn))}catch(e){}}
function ensureDaily(){const k=todayKey();if(!learn.daily[k])learn.daily[k]={questions:0,correct:0,wrong:0,seconds:0};return learn.daily[k]}
function bumpFeature(bucket,key,wrong){if(!learn[bucket][key])learn[bucket][key]={attempts:0,wrong:0};learn[bucket][key].attempts++;if(wrong)learn[bucket][key].wrong++}
function recordFirstAttempt(id,ok){const q=learn.questions[id];q.attempts++;q.lastSeen=Date.now();if(ok)q.correct++;else q.wrong++;const d=ensureDaily();d.questions++;if(ok)d.correct++;else d.wrong++;
 const m=studyMeta[id];bumpFeature('wh',m.wh[0],!ok);m.words.forEach(w=>bumpFeature('words',w[0],!ok));m.phrases.forEach(p=>bumpFeature('phrases',p[0],!ok));saveStore();updateStudyRecordUI()}
function flushLearningTime(){if(!sessionStarted)return;const delta=Math.max(0,sessionElapsedSec-sessionSavedSec);if(!delta)return;ensureDaily().seconds+=delta;sessionSavedSec=sessionElapsedSec;saveStore()}
function formatTime(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function formatMin(sec){if(sec<60)return `${sec}秒`;const m=Math.floor(sec/60),s=sec%60;return s?`${m}分${s}秒`:`${m}分`}
function remainingSec(){return Math.max(0,TARGET_SEC-sessionElapsedSec)}
function updateHeader(){qnum.textContent='Q'+String(sessionQuestionNo).padStart(2,'0');if(sessionFinished){round.textContent='15分';phaseName.textContent='完了';return}round.textContent='残り';phaseName.textContent=sessionStarted?formatTime(remainingSec()):'15:00';phaseName.classList.toggle('timerUrgent',sessionStarted&&remainingSec()<=120)}
setInterval(()=>{if(sessionStarted&&!sessionFinished&&!document.hidden){sessionElapsedSec++;updateHeader();if(sessionElapsedSec%5===0)flushLearningTime()}},1000);
window.addEventListener('pagehide',flushLearningTime);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushLearningTime()});

function topWeakFeatures(bucket,n=3){return Object.entries(learn[bucket]).filter(([,v])=>v.attempts>=1&&v.wrong>0).sort((a,b)=>(b[1].wrong/b[1].attempts)-(a[1].wrong/a[1].attempts)||b[1].wrong-a[1].wrong).slice(0,n)}
function updateStudyRecordUI(){const d=ensureDaily();const qEl=document.getElementById('todayQ'),tEl=document.getElementById('todayTime'),aEl=document.getElementById('todayAcc'),wEl=document.getElementById('weakBox');if(!qEl)return;qEl.textContent=`${d.questions}問`;tEl.textContent=formatMin(d.seconds);aEl.textContent=d.questions?`${Math.round(d.correct/d.questions*100)}%`:'—';const ws=topWeakFeatures('wh',2),ps=topWeakFeatures('phrases',2);const bits=[];if(ws.length)bits.push('疑問詞：'+ws.map(x=>x[0]).join('・'));if(ps.length)bits.push('表現：'+ps.map(x=>x[0]).join(' / '));wEl.textContent=bits.length?'いまの苦手傾向 → '+bits.join('　'):'まだ苦手データはありません。'}

function questionWeight(id){const q=learn.questions[id], base=1+(q.wrong*0.25);const err=q.attempts?q.wrong/q.attempts:0;let w=base+err*4;const m=studyMeta[id],wh=learn.wh[m.wh[0]];if(wh?.attempts)w+=(wh.wrong/wh.attempts)*2;m.phrases.forEach(p=>{const x=learn.phrases[p[0]];if(x?.attempts)w+=(x.wrong/x.attempts)*.45});if(recentQ.includes(id))w*=.18;return Math.max(.08,w)}
function weightedPick(ids){let total=ids.reduce((a,id)=>a+questionWeight(id),0),r=Math.random()*total;for(const id of ids){r-=questionWeight(id);if(r<=0)return id}return ids[ids.length-1]}
function pickNextQuestion(){let unseen=[...Array(questions.length).keys()].filter(id=>!sessionSeen.has(id));let pool=unseen.length?unseen:[...Array(questions.length).keys()];if(unseen.length){pool.sort((a,b)=>learn.questions[a].attempts-learn.questions[b].attempts);const min=learn.questions[pool[0]].attempts;const fair=pool.filter(id=>learn.questions[id].attempts<=min+1);return weightedPick(fair)}return weightedPick(pool)}
function setQuestion(id){qi=id;sessionSeen.add(id);recentQ.push(id);if(recentQ.length>3)recentQ.shift();phase=0;selected=null;step1Feedback=null;heardCurrent=false;phaseAudioDone=false;render()}
function shouldFinishLesson(){return sessionStarted&&sessionElapsedSec>=FINISH_THRESHOLD_SEC&&sessionFirstAttempts>=5}
function advanceQuestion(){if(shouldFinishLesson()){showResult();return}sessionQuestionNo++;setQuestion(pickNextQuestion())}

function ensureAudio(){if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,start,dur,type='sine',gain=0.12){if(sfxOnSel?.value==='0')return;const ctx=ensureAudio();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+start);const v=gain*parseFloat(sfxVolSel?.value||0.55);g.gain.setValueAtTime(0.0001,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(Math.max(v,0.0002),ctx.currentTime+start+.012);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur+.03)}
function sfx(kind){if(sfxOnSel?.value==='0'||speaking)return;ensureAudio();if(kind==='tap'){tone(660,0,.07,'sine',.08)}else if(kind==='step'){tone(520,0,.055,'sine',.06);tone(700,.06,.07,'sine',.05)}else if(kind==='question'){tone(440,0,.07,'triangle',.06);tone(620,.09,.1,'triangle',.06)}else if(kind==='correct'){tone(523,0,.14,'sine',.10);tone(659,.11,.15,'sine',.10);tone(784,.23,.22,'sine',.12)}else if(kind==='wrong'){tone(220,0,.12,'triangle',.08);tone(185,.13,.18,'triangle',.07)}else if(kind==='streak'){tone(659,0,.09,'sine',.08);tone(784,.08,.1,'sine',.09);tone(988,.17,.18,'sine',.11)}else if(kind==='next'){tone(560,0,.06,'sine',.05);tone(760,.065,.08,'sine',.05)}}
function streakText(){if(currentStreak>=10)return 'Excellent!';if(currentStreak>=5)return 'Great!';if(currentStreak>=3)return 'Nice!';return ''}
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function voiceFor(g){const sel=g==='M'?maleSel:femaleSel;return voices.find(v=>v.voiceURI===sel.value)||voices.find(v=>/^en/i.test(v.lang))||null}
function stop(){speechSynthesis.cancel();speaking=false}
function say(text,g='F',after=null){stop();const u=new SpeechSynthesisUtterance(text);const v=voiceFor(g);if(v)u.voice=v;u.lang=v?.lang||'en-US';u.rate=parseFloat(rateSel.value);u.pitch=g==='M'?0.88:1.08;u.onstart=()=>speaking=true;u.onend=()=>{speaking=false;if(after)after()};u.onerror=()=>{speaking=false;if(after)after()};speechSynthesis.speak(u)}
function sequence(items,i=0,done=null){if(i>=items.length){if(done)done();return}const [t,g]=items[i];say(t,g,()=>setTimeout(()=>sequence(items,i+1,done),180))}
function playCurrent(done=null){const x=questions[qi];if(phase===0||phase===6){sequence([[x.d[0][1],x.d[0][0]],[x.d[1][1],x.d[1][0]],[x.q[0],'F']],0,done)}else if(phase===1)say(x.d[0][1],x.d[0][0],done);else if(phase===2)say(x.d[1][1],x.d[1][0],done);else if(phase===3)say(x.q[0],'F',done)}
function stageLabel(t){return `<div class="stageLabel">${t}</div>`}
function choices(includeJ=false,clickable=false,result=false,step1=false){const x=questions[qi];return `<div class="choiceGrid ${clickable?'readyGlow':''}">`+x.c.map((c,i)=>{const flash=step1&&step1Feedback?(i===step1Feedback.i?(step1Feedback.ok?'flashOk':'flashNg'):''):'';return `<button class="choice ${clickable?'ready':'locked'} ${result&&i===x.a?'correct':''} ${result&&selected===i&&i!==x.a?'wrong':''} ${flash}" ${clickable?`onclick="choose(${i})"`:''} ${clickable?'':'disabled'}><div class="n">${i+1}</div><div><div class="en">${esc(c[0])}</div>${includeJ?`<div class="j">${esc(c[1])}</div>`:''}</div></button>`}).join('')+`</div>`}
function fitOneLine(el,maxPx,minPx){if(!el)return;el.style.fontSize=maxPx+'px';let n=maxPx;while(el.scrollWidth>el.clientWidth&&n>minPx){n--;el.style.fontSize=n+'px'}}
function fitVisibleLines(){document.querySelectorAll('.fitEn').forEach(el=>fitOneLine(el,window.innerHeight<=500?48:56,16));document.querySelectorAll('.fitJp').forEach(el=>fitOneLine(el,window.innerHeight<=500?27:32,12))}
function clearPulse(){replayBtn.classList.remove('actionPulse');nextBtn.classList.remove('actionPulse')}
function startSessionIfNeeded(){if(!sessionStarted){sessionStarted=true;updateHeader()}}
function beginStep1Audio(){if(phase!==0||speaking)return;startSessionIfNeeded();ensureAudio();clearPulse();step1Feedback=null;replayBtn.disabled=true;nextBtn.disabled=true;prevBtn.disabled=true;replayBtn.textContent='🔊 再生中…';hint.textContent='選択肢を見ながら会話 → Question を聞く';playCurrent(()=>{heardCurrent=true;replayBtn.disabled=false;prevBtn.disabled=(sessionQuestionNo===1);replayBtn.textContent='↻ もう一度';hint.textContent='聞き終わりました。答えをタップ！';render()})}
function playReviewPhase(){if(!(phase>=1&&phase<=3)||speaking)return;clearPulse();phaseAudioDone=false;nextBtn.disabled=true;replayBtn.disabled=true;replayBtn.textContent='🔊 再生中…';playCurrent(()=>{phaseAudioDone=true;nextBtn.disabled=false;replayBtn.disabled=false;replayBtn.textContent='↻ もう一度';nextBtn.classList.add('actionPulse');hint.textContent='聞けたら「次へ」';})}
function replayReview(){if(speaking)return;clearPulse();nextBtn.disabled=true;replayBtn.disabled=true;replayBtn.textContent='🔊 再生中…';playCurrent(()=>{phaseAudioDone=true;nextBtn.disabled=false;replayBtn.disabled=false;replayBtn.textContent='↻ もう一度';nextBtn.classList.add('actionPulse')})}

function render(){
 stop();clearPulse();updateHeader();const x=questions[qi];prevBtn.disabled=(phase===0&&sessionQuestionNo===1);nextBtn.disabled=false;replayBtn.disabled=false;nextBtn.textContent='次へ →';replayBtn.textContent='↻ もう一度';
 if(phase===0){
   round.textContent=sessionStarted?'残り':'1回目'; if(!sessionStarted)phaseName.textContent='まず聞く';
   const ready=heardCurrent&&!speaking&&!step1Feedback;nextBtn.disabled=true;replayBtn.textContent=heardCurrent?'↻ もう一度':'▶ スタート';hint.textContent=heardCurrent?'聞き終わりました。答えをタップ！':'4つの選択肢を先に見てからスタート';
   if(!heardCurrent)replayBtn.classList.add('actionPulse');
   card.innerHTML=stageLabel('STEP 1 / 本番チャレンジ')+(heardCurrent?`<div class="answerCue">👆 聞き終わりました。答えをタップ！</div>`:`<div class="instructions">日本語はまだ見ません。4つの選択肢を頭に入れてから聞こう。</div>`)+choices(false,ready,false,true)+(step1Feedback?`<div class="quickResult ${step1Feedback.ok?'ok':'ng'} pop">${step1Feedback.ok?'〇 正解！ 次へ':'× ちがうよ。ここから復習！'}</div>`:'');
 }
 if(phase===1){round.textContent='復習';phaseName.textContent='会話①';hint.textContent='音声のあと「次へ」';card.innerHTML=stageLabel('STEP 2 / 会話①')+`<div class="speaker ${x.d[0][0]==='F'?'f':'m'}">${x.d[0][0]==='F'?'👩 WOMAN':'👨 MAN'}</div><div class="bigText singleLine fitEn">${esc(x.d[0][1])}</div><div class="jp singleLineJp fitJp">${esc(x.d[0][2])}</div>`;requestAnimationFrame(fitVisibleLines);setTimeout(playReviewPhase,220)}
 if(phase===2){round.textContent='復習';phaseName.textContent='会話②';hint.textContent='音声のあと「次へ」';card.innerHTML=stageLabel('STEP 3 / 会話②')+`<div class="speaker ${x.d[1][0]==='F'?'f':'m'}">${x.d[1][0]==='F'?'👩 WOMAN':'👨 MAN'}</div><div class="bigText singleLine fitEn">${esc(x.d[1][1])}</div><div class="jp singleLineJp fitJp">${esc(x.d[1][2])}</div>`;requestAnimationFrame(fitVisibleLines);setTimeout(playReviewPhase,220)}
 if(phase===3){round.textContent='復習';phaseName.textContent='Question';hint.textContent='音声のあと「次へ」';card.innerHTML=stageLabel('STEP 4 / QUESTION')+`<div class="speaker">❓ QUESTION</div><div class="questionText singleLine fitEn">${esc(x.q[0])}</div><div class="questionJp singleLineJp fitJp">${esc(x.q[1])}</div>`;requestAnimationFrame(fitVisibleLines);setTimeout(playReviewPhase,220)}
 if(phase===4){round.textContent='復習';phaseName.textContent='もう一度回答';hint.textContent='意味を確認して答えをタップ';nextBtn.disabled=true;replayBtn.disabled=false;card.innerHTML=stageLabel('STEP 5 / CHOOSE')+`<div class="answerCue">👆 日本語も確認して、もう一度答えよう</div>`+choices(true,true)}
 if(phase===6){round.textContent='復習';phaseName.textContent='答え';hint.textContent='解説を確認して次へ';nextBtn.textContent=shouldFinishLesson()?'レッスン終了':'次の問題 →';nextBtn.classList.add('actionPulse');const ok=selected===x.a;card.innerHTML=stageLabel('ANSWER / 答え合わせ')+`<div class="answerBanner ${ok?'ok':'ng'} pop">${ok?'〇 復習で正解！':'× おしい！'}　正解 ${x.a+1}</div><div class="answerBody"><div class="fullScript"><div class="line"><span class="who">${x.d[0][0]==='F'?'WOMAN':'MAN'}:</span>${esc(x.d[0][1])}<span class="trInline">｜ ${esc(x.d[0][2])}</span></div><div class="line"><span class="who">${x.d[1][0]==='F'?'WOMAN':'MAN'}:</span>${esc(x.d[1][1])}<span class="trInline">｜ ${esc(x.d[1][2])}</span></div><div class="line"><span class="who">QUESTION:</span>${esc(x.q[0])}<span class="trInline">｜ ${esc(x.q[1])}</span></div></div><div class="explain"><b>解説：</b>${esc(x.e)}　<span style="color:#fff100">疑問詞：${esc(studyMeta[qi].wh[0])}（${esc(studyMeta[qi].wh[1])}）</span></div></div>`}
}

window.choose=function(i){ensureAudio();if(speaking)return;selected=i;const ok=i===questions[qi].a;
 if(phase===0){if(!heardCurrent||step1Feedback)return;sessionFirstAttempts++;sessionAttempted.push(qi);recordFirstAttempt(qi,ok);
   if(ok){sessionCorrect++;currentStreak++;bestStreak=Math.max(bestStreak,currentStreak);sfx([3,5,10].includes(currentStreak)?'streak':'correct');step1Feedback={i,ok:true};render();setTimeout(advanceQuestion,850)}
   else{sessionWrong++;currentStreak=0;sessionWrongMap[qi]=(sessionWrongMap[qi]||0)+1;sfx('wrong');step1Feedback={i,ok:false};render();setTimeout(()=>{step1Feedback=null;phase=1;selected=null;render()},850)}return}
 if(phase===4){sfx(ok?'correct':'wrong');if(!ok)sessionWrongMap[qi]=(sessionWrongMap[qi]||0)+1;phase=6;render()}
}
nextBtn.onclick=()=>{ensureAudio();stop();clearPulse();if(phase===0)return;if(phase>=1&&phase<=3){if(!phaseAudioDone)return;phase++;phaseAudioDone=false;sfx(phase===3?'question':'step');render();return}if(phase===6){sfx('next');advanceQuestion()}}
prevBtn.onclick=()=>{ensureAudio();stop();clearPulse();sfx('tap');step1Feedback=null;if(phase===6){phase=4;render()}else if(phase>1){phase--;phaseAudioDone=false;render()}else if(phase===1){phase=0;heardCurrent=true;render()}else if(sessionQuestionNo>1){hint.textContent='前の問題へ戻る機能は復習中のみ利用できます'}}
replayBtn.onclick=()=>{ensureAudio();if(phase===0)beginStep1Audio();else if(phase>=1&&phase<=3)replayReview();else if(phase===6){replayBtn.disabled=true;playCurrent(()=>{replayBtn.disabled=false})}}

function buildPrintSheet(){const sheet=document.getElementById('printSheet'),date=new Date().toLocaleDateString('ja-JP'),pct=sessionFirstAttempts?Math.round(sessionCorrect/sessionFirstAttempts*100):0;let ids=Object.keys(sessionWrongMap).map(Number);ids.sort((a,b)=>(sessionWrongMap[b]-sessionWrongMap[a])||(learn.questions[b].wrong-learn.questions[a].wrong));ids=ids.slice(0,6);let body='';if(ids.length){body=`<h2 class="printTitle">今回の要復習ポイント</h2><div class="weakPrintGrid">`+ids.map(id=>{const q=questions[id],m=studyMeta[id];return `<article class="weakCard"><h3>Q ${id+1}　${esc(m.wh[0])}（${esc(m.wh[1])}）</h3><div class="qline">${esc(q.q[0])}<br>${esc(q.q[1])}</div><dl><dt>重要単語</dt><dd>${m.words.map(w=>`${esc(w[0])}＝${esc(w[1])}`).join(' ／ ')}</dd><dt>熟語・表現</dt><dd>${m.phrases.map(p=>`${esc(p[0])}＝${esc(p[1])}`).join(' ／ ')}</dd><dt>聞くポイント</dt><dd>${esc(q.e)}</dd></dl></article>`}).join('')+`</div>`}else{body=`<h2 class="printTitle">今回の復習</h2><div class="weakCard"><h3>初回回答で大きな弱点はありませんでした</h3><div class="qline">次回も選択肢を先読みし、Question の疑問詞を意識して聞きましょう。</div></div>`}
 sheet.innerHTML=`<div class="printHead"><h1>英検4級 リスニング　復習シート</h1><div class="printMeta"><span>${date}</span><span>15分トレーニング</span></div></div><div class="printSummary"><div><b>${sessionFirstAttempts}問</b><span>今回解いた問題</span></div><div><b>${formatMin(sessionElapsedSec)}</b><span>学習時間</span></div><div><b>${pct}%</b><span>初回正答率</span></div></div>${body}<div class="printFoot">間違えた疑問詞・重要単語・熟語を優先して自動抽出</div>`}
window.printReview=function(){buildPrintSheet();setTimeout(()=>window.print(),80)}
function showResult(){stop();clearPulse();sessionFinished=true;flushLearningTime();const pct=sessionFirstAttempts?Math.round(sessionCorrect/sessionFirstAttempts*100):0;learn.sessions.push({date:new Date().toISOString(),seconds:sessionElapsedSec,questions:sessionFirstAttempts,correct:sessionCorrect,wrong:sessionWrong});learn.sessions=learn.sessions.slice(-60);saveStore();updateHeader();const weakWh=topWeakFeatures('wh',3).map(x=>x[0]).join('・')||'なし';card.innerHTML=stageLabel('15分 LESSON COMPLETE')+`<div class="bigText">${sessionFirstAttempts}問トライ！</div><div class="streakBadge pop">🏆 初回正答率 ${pct}%　・　学習 ${formatMin(sessionElapsedSec)}　・　最高 ${bestStreak}問連続</div><div class="jp" style="color:#fff;font-size:clamp(14px,2vw,21px)">現在の苦手疑問詞：${esc(weakWh)}</div><div style="display:flex;justify-content:center;gap:10px;margin-top:12px"><button class="btn primary actionPulse" onclick="printReview()">🖨 A4復習シート</button><button class="btn" onclick="restart()">次の15分レッスン</button></div>`;hint.textContent='学習記録は「音声・効果音」内から後でも確認できます';nextBtn.disabled=true;prevBtn.disabled=true;replayBtn.disabled=true;updateStudyRecordUI()}
window.restart=function(){stop();sessionStarted=false;sessionFinished=false;sessionElapsedSec=0;sessionSavedSec=0;sessionQuestionNo=1;sessionFirstAttempts=0;sessionCorrect=0;sessionWrong=0;currentStreak=0;bestStreak=0;sessionSeen=new Set();recentQ=[];sessionWrongMap={};sessionAttempted=[];setQuestion(pickNextQuestion());sfx('next')}

function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang)||/English/i.test(v.name));const opts=voices.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');maleSel.innerHTML=opts;femaleSel.innerHTML=opts;const lower=n=>n.toLowerCase();const m=voices.find(v=>/alex|daniel|aaron|fred|arthur|guy|male/.test(lower(v.name)))||voices[0];const f=voices.find(v=>/samantha|karen|moira|tessa|victoria|ava|susan|zira|female/.test(lower(v.name)))||voices[Math.min(1,voices.length-1)]||voices[0];if(m)maleSel.value=m.voiceURI;if(f)femaleSel.value=f.voiceURI}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
document.getElementById('settingsBtn').onclick=()=>{ensureAudio();sfx('tap');updateStudyRecordUI();settings.classList.add('show')};document.getElementById('closeSettings').onclick=()=>{sfx('tap');settings.classList.remove('show')};document.getElementById('testVoice').onclick=()=>sequence([['Good morning. Are you ready?','M'],['Yes, I am ready. Let us start.','F']]);document.getElementById('testSfx').onclick=()=>{ensureAudio();sfx('correct')};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
window.addEventListener('resize',()=>requestAnimationFrame(fitVisibleLines));
updateStudyRecordUI();setQuestion(pickNextQuestion());
</script>
</body></html>
